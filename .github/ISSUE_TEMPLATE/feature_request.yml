name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please explain the problem you want to solve and what a good solution looks like.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What’s missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, UX, and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope / notes
      description: Any technical constraints, routes, APIs, or mockups?
    validations:
      required: false
